name: Shorebird Patch (OTA)

# Instant over-the-air patch for Dart-only changes (UI, logic, prompts, API
# fixes). No APK download needed — the app picks up the patch on next start.
# Use this for all non-native changes. For native changes (plugins, pubspec,
# AndroidManifest, assets), push to main instead so build-apk.yml makes a
# full Shorebird release.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to patch (e.g. 1.4.9). Empty = latest release.'
        required: false
        default: ''

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird (Flutter + OTA)
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup android/local.properties
        shell: bash
        run: |
          FLUTTER_BIN="$HOME/.shorebird/bin/cache/flutter/"*/bin/flutter
          FLUTTER_BIN=$(echo $FLUTTER_BIN | cut -d' ' -f1)
          FLUTTER_ROOT=$(dirname $(dirname "$FLUTTER_BIN"))
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties

      - name: Create OTA patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: |
          $ver = "${{ inputs.release_version }}"
          if ($ver -eq "") {
            shorebird patch android --verbose -- --dart-define=GEMINI_API_KEY=$env:GEMINI_API_KEY --dart-define=OWM_API_KEY=$env:OWM_API_KEY > patch-log.txt 2>&1
          } else {
            shorebird patch android --verbose --release-version $ver -- --dart-define=GEMINI_API_KEY=$env:GEMINI_API_KEY --dart-define=OWM_API_KEY=$env:OWM_API_KEY > patch-log.txt 2>&1
          }
          $code = $LASTEXITCODE
          Get-Content patch-log.txt | Select-Object -Last 30
          exit $code

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-log
          path: patch-log.txt
