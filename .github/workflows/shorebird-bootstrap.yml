name: Shorebird Bootstrap (one-time)

# One-time job to create the Lifeez app on Shorebird and print the app_id.
# Trigger manually, then delete this file.
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Check CLI commands
        shell: bash
        run: |
          shorebird --version
          echo "=== apps help ==="
          shorebird apps --help || true

      - name: Create Lifeez app
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # settings.gradle.kts requires android/local.properties with flutter.sdk.
          # Find Shorebird's Flutter.
          echo "shorebird bin: $HOME/.shorebird/bin"
          ls "$HOME/.shorebird/bin/cache/flutter/bin/" 2>/dev/null || true
          FLUTTER_BIN="$HOME/.shorebird/bin/cache/flutter/bin/flutter"
          if [ ! -f "$FLUTTER_BIN" ]; then
            FLUTTER_BIN=$(find "$HOME/.shorebird" -name "flutter" -type f 2>/dev/null | head -1)
          fi
          echo "Flutter: $FLUTTER_BIN"
          FLUTTER_ROOT=$(dirname $(dirname "$FLUTTER_BIN"))
          echo "Shorebird Flutter root: $FLUTTER_ROOT"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties
          # shorebird init creates the app on Shorebird servers and writes shorebird.yaml.
          # Provide answers for interactive prompts: app name = Lifeez.
          printf 'Lifeez\n\n\n' | shorebird init --verbose > init-log.txt 2>&1 || true
          tail -40 init-log.txt
          echo "=== apps list ==="
          shorebird apps list || true
          echo "=== shorebird.yaml ==="
          cat shorebird.yaml || true
