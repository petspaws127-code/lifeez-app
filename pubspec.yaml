name: ai_life_assistant
description: "Lifeez — tell it, it remembers it. WhatsApp-first AI life management."
publish_to: "none"
version: 1.3.3+20

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & auth
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.1
  flutter_facebook_auth: ^7.1.1

  # UI
  google_fonts: ^6.2.1
  provider: ^6.1.2
  fl_chart: ^0.68.0
  font_awesome_flutter: ^11.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  speech_to_text: ^7.5.0
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6
  image_picker: ^1.0.7
  http: ^1.2.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4
  open_filex: ^4.3.0
  shared_preferences: ^2.3.0

  # Notifications, biometrics, bill OCR
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  local_auth: ^2.3.0
  google_mlkit_text_recognition: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lifeez_logo.png
    - assets/lifeez_logo_dark.png
