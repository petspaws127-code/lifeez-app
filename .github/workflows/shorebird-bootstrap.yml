name: Shorebird Bootstrap (one-time)

# One-time job to create the Lifeez app on Shorebird and print the app_id.
# Trigger manually, then delete this file.
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Check CLI commands
        shell: bash
        run: |
          shorebird --version
          echo "=== apps help ==="
          shorebird apps --help || true

      - name: Create Lifeez app via Shorebird API
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # Create the app directly via Shorebird API (shorebird init is interactive).
          # First, get the organization ID.
          echo "=== organizations ==="
          ORGS=$(curl -s -H "Authorization: Bearer $SHOREBIRD_TOKEN" \
            https://api.shorebird.dev/api/v1/organizations)
          echo "$ORGS" | head -c 500
          echo ""
          ORG_ID=$(echo "$ORGS" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "ORG_ID=$ORG_ID"
          # Create the app.
          echo "=== create app ==="
          RESULT=$(curl -s -X POST \
            -H "Authorization: Bearer $SHOREBIRD_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"organization_id\": $ORG_ID, \"display_name\": \"Lifeez\"}" \
            https://api.shorebird.dev/api/v1/apps)
          echo "$RESULT" | head -c 1000
          echo ""
          # Extract app_id and write shorebird.yaml
          APP_ID=$(echo "$RESULT" | grep -o '"id":"[a-f0-9-]*"' | head -1 | grep -o '[a-f0-9-]\{36\}')
          echo "APP_ID=$APP_ID"
          if [ -n "$APP_ID" ]; then
            printf '# Shorebird configuration\napp_id: %s\n' "$APP_ID" > shorebird.yaml
            cat shorebird.yaml
          else
            echo "FAILED to get app_id"
            exit 1
          fi
          echo "=== apps list ==="
          shorebird apps list || true
