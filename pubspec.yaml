name: ai_life_assistant
description: "Lifeez — tell it, it remembers it. WhatsApp-first AI life management."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & auth
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.1
  flutter_facebook_auth: ^7.1.1

  # UI
  google_fonts: ^6.2.1
  provider: ^6.1.2
  fl_chart: ^0.68.0
  font_awesome_flutter: ^10.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
