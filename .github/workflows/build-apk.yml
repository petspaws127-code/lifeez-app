name: Build Lifeez APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird (Flutter + OTA)
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Get dependencies
        shell: bash
        run: flutter pub get

      - name: Setup android/local.properties
        shell: bash
        run: |
          FLUTTER_BIN="$HOME/.shorebird/bin/cache/flutter/"*/bin/flutter
          FLUTTER_BIN=$(echo $FLUTTER_BIN | cut -d' ' -f1)
          FLUTTER_ROOT=$(dirname $(dirname "$FLUTTER_BIN"))
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties

      - name: Shorebird release APK
        id: build_release
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: |
          shorebird release android --artifact apk --verbose -- --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY --dart-define=OWM_API_KEY=$OWM_API_KEY > build-release-log.txt 2>&1
          code=$?
          tail -30 build-release-log.txt
          exit $code

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-log
          path: build-release-log.txt

      - name: Upload release APK
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lifeez-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Fail if build failed
        if: steps.build_release.outcome != 'success'
        shell: bash
        run: exit 1
