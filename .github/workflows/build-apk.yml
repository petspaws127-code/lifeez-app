name: Build Lifeez APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        id: build
        run: flutter build apk --debug --verbose 2>&1 | Tee-Object -FilePath build-log.txt
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lifeez-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build release APK
        id: build_release
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release --dart-define=GEMINI_API_KEY=$env:GEMINI_API_KEY --verbose > build-release-log.txt 2>&1
          $code = $LASTEXITCODE
          Get-Content build-release-log.txt | Select-Object -Last 30
          exit $code

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-log
          path: build-release-log.txt

      - name: Upload release APK
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lifeez-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
